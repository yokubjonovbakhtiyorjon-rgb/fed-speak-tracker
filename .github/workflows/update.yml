name: Update Fed speak tracker

on:
  schedule:
    # GitHub cron runs in UTC. 11:07-23:37 UTC is 7:07 a.m.-7:37 p.m. EDT (6:07 a.m.-6:37 p.m. EST).
    - cron: "7,37 11-23 * * 1-5"   # every 30 minutes during U.S. business hours, Monday-Friday
    - cron: "17 */6 * * *"          # every 6 hours around the clock (covers weekends and evenings)
  workflow_dispatch: {}             # manual "Run workflow" button

permissions:
  contents: write    # commit the updated archive in data/
  pages: write       # publish to GitHub Pages
  id-token: write

concurrency:
  group: fed-speak-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: python -m unittest discover -s tests

      - name: Fetch sources and build the site
        run: python scripts/build.py

      - name: Commit updated archive
        run: |
          git config user.name "fed-speak-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "Update archive $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
